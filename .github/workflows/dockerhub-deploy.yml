name: Build and Publish Agent Studio to DockerHub

on:
  push:
    tags:
      - 'v*'  # This will trigger on version tags like v1.0.0, v2.1.0, etc.
  workflow_dispatch:  # Allow manual triggering

# Least-privilege GITHUB_TOKEN: this workflow only needs to read the repo
# (checkout) and authenticates to DockerHub via a separate secret.
permissions:
  contents: read

env:
  IMAGE_NAME: agent-studio
  DOCKERHUB_USERNAME: hasithy99x  # DockerHub login username
  DOCKERHUB_ORG: 99xio  # Organization/namespace for publishing images

jobs:
  # Each architecture is built on a runner of that architecture. Building
  # linux/arm64 under QEMU on an amd64 runner reliably hung in `npm ci`
  # ("qemu: uncaught target signal 4"), so the platforms must not be combined
  # into a single buildx invocation.
  build:
    name: Build ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
            runner: ubuntu-latest
          - arch: arm64
            platform: linux/arm64
            runner: ubuntu-24.04-arm

    steps:
    - name: Checkout code
      uses: actions/checkout@v6

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v4

    - name: Log in to DockerHub
      uses: docker/login-action@v4
      with:
        username: ${{ env.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    - name: Extract image labels
      id: meta
      uses: docker/metadata-action@v6
      with:
        images: ${{ env.DOCKERHUB_ORG }}/${{ env.IMAGE_NAME }}
        labels: |
          org.opencontainers.image.title=${{ env.IMAGE_NAME }}
          org.opencontainers.image.description=Agent Studio - AI Agent workflow management platform
          org.opencontainers.image.vendor=${{ env.DOCKERHUB_ORG }}

    - name: Build and push by digest
      id: build
      uses: docker/build-push-action@v7
      with:
        context: .
        file: ./Dockerfile
        platforms: ${{ matrix.platform }}
        labels: ${{ steps.meta.outputs.labels }}
        # Provenance adds an extra manifest per platform, which conflicts with
        # assembling the manifest list by digest in the publish job.
        provenance: false
        # Without a per-arch scope the two runners overwrite each other's cache
        # entries and neither gets a usable hit.
        cache-from: type=gha,scope=${{ matrix.arch }}
        cache-to: type=gha,mode=max,scope=${{ matrix.arch }}
        outputs: type=image,name=${{ env.DOCKERHUB_ORG }}/${{ env.IMAGE_NAME }},push-by-digest=true,name-canonical=true,push=true

    - name: Export digest
      run: |
        mkdir -p "${{ runner.temp }}/digests"
        digest="${{ steps.build.outputs.digest }}"
        touch "${{ runner.temp }}/digests/${digest#sha256:}"

    - name: Upload digest
      uses: actions/upload-artifact@v7
      with:
        name: digest-${{ matrix.arch }}
        path: ${{ runner.temp }}/digests/*
        if-no-files-found: error
        retention-days: 1

  publish:
    name: Publish manifest
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 15

    steps:
    - name: Checkout code
      uses: actions/checkout@v6
      with:
        # Full history needed so we can determine whether the tagged commit
        # is reachable from main (see "Check if tag is releasable as latest" step).
        fetch-depth: 0

    - name: Download digests
      uses: actions/download-artifact@v8
      with:
        path: ${{ runner.temp }}/digests
        pattern: digest-*
        merge-multiple: true

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v4

    - name: Log in to DockerHub
      uses: docker/login-action@v4
      with:
        username: ${{ env.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    - name: Check if tag is releasable as latest
      id: latest_check
      env:
        REF_TYPE: ${{ github.ref_type }}
        REF_NAME: ${{ github.ref_name }}
        SHA: ${{ github.sha }}
      run: |
        # ":latest" must only ever point at the newest stable release cut from
        # main. Manual runs, pre-releases (v1.2.0-rc1), tags from old or
        # maintenance branches, and re-pushes of older versions never move it.
        is_latest=false
        git fetch origin main --tags --quiet
        highest=$(git tag -l 'v*' --sort=-v:refname | grep -v -e '-' | head -n1)
        if [ "$REF_TYPE" != "tag" ]; then
          reason="not a tag push"
        elif [[ "$REF_NAME" == *-* ]]; then
          reason="pre-release tag"
        elif ! git merge-base --is-ancestor "$SHA" origin/main; then
          reason="tagged commit is not on main branch history"
        elif [ "$REF_NAME" != "$highest" ]; then
          reason="not the highest release (highest is $highest)"
        else
          is_latest=true
          reason="newest stable release on main"
        fi
        echo "$REF_NAME: is_latest=$is_latest ($reason)"
        echo "is_latest=$is_latest" >> "$GITHUB_OUTPUT"

    - name: Extract metadata
      id: meta
      uses: docker/metadata-action@v6
      with:
        images: ${{ env.DOCKERHUB_ORG }}/${{ env.IMAGE_NAME }}
        tags: |
          # Tag for version tags
          type=ref,event=tag
          # Semantic versioning tags
          type=semver,pattern={{version}}
          type=semver,pattern={{major}}.{{minor}}
          type=semver,pattern={{major}}
          # Only when the check above says this is the newest stable release on main
          type=raw,value=latest,enable=${{ steps.latest_check.outputs.is_latest == 'true' }}
        # The default latest=auto adds :latest to every semver tag push regardless of
        # the rule above, so it must be turned off.
        flavor: |
          latest=false

    - name: Create and push manifest list
      working-directory: ${{ runner.temp }}/digests
      run: |
        docker buildx imagetools create \
          $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
          $(printf '${{ env.DOCKERHUB_ORG }}/${{ env.IMAGE_NAME }}@sha256:%s ' *)

    - name: Inspect published image
      run: |
        docker buildx imagetools inspect \
          "${{ env.DOCKERHUB_ORG }}/${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.version }}"

    - name: Generate build summary
      run: |
        echo "## 🚀 Agent Studio Docker Image Published Successfully!" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "**Image:** \`${{ env.DOCKERHUB_ORG }}/${{ env.IMAGE_NAME }}\`" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "**Tags:**" >> $GITHUB_STEP_SUMMARY
        echo '${{ steps.meta.outputs.tags }}' | sed 's/^/- `/' | sed 's/$/`/' >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "**Eligible for :latest:** ${{ steps.latest_check.outputs.is_latest }}" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "**Platforms:** linux/amd64, linux/arm64" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "**Docker Pull Command:**" >> $GITHUB_STEP_SUMMARY
        echo "\`\`\`bash" >> $GITHUB_STEP_SUMMARY
        echo "docker pull ${{ env.DOCKERHUB_ORG }}/${{ env.IMAGE_NAME }}:latest" >> $GITHUB_STEP_SUMMARY
        echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "**Quick Start:**" >> $GITHUB_STEP_SUMMARY
        echo "\`\`\`bash" >> $GITHUB_STEP_SUMMARY
        echo "# Create environment file" >> $GITHUB_STEP_SUMMARY
        echo "cat > .env.production << EOF" >> $GITHUB_STEP_SUMMARY
        echo "XIANS_APIKEY=your-api-key" >> $GITHUB_STEP_SUMMARY
        echo "XIANS_SERVER_URL=https://your-server.com" >> $GITHUB_STEP_SUMMARY
        echo "NEXTAUTH_URL=https://your-domain.com" >> $GITHUB_STEP_SUMMARY
        echo "NEXTAUTH_SECRET=your-secret" >> $GITHUB_STEP_SUMMARY
        echo "GOOGLE_CLIENT_ID=your-google-client-id" >> $GITHUB_STEP_SUMMARY
        echo "GOOGLE_CLIENT_SECRET=your-google-client-secret" >> $GITHUB_STEP_SUMMARY
        echo "EOF" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "# Run the container" >> $GITHUB_STEP_SUMMARY
        echo "docker run -d --name agent-studio -p 3000:3000 \\" >> $GITHUB_STEP_SUMMARY
        echo "  --env-file .env.production \\" >> $GITHUB_STEP_SUMMARY
        echo "  --restart unless-stopped \\" >> $GITHUB_STEP_SUMMARY
        echo "  ${{ env.DOCKERHUB_ORG }}/${{ env.IMAGE_NAME }}:latest" >> $GITHUB_STEP_SUMMARY
        echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "**Health Check:**" >> $GITHUB_STEP_SUMMARY
        echo "\`\`\`bash" >> $GITHUB_STEP_SUMMARY
        echo "curl http://localhost:3000/api/health" >> $GITHUB_STEP_SUMMARY
        echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
