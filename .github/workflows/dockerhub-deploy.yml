name: Build and Publish Agent Studio to DockerHub

on:
  push:
    tags:
      - 'v*'  # This will trigger on version tags like v1.0.0, v2.1.0, etc.
  workflow_dispatch:  # Allow manual triggering

# Least-privilege GITHUB_TOKEN: this workflow only needs to read the repo
# (checkout) and authenticates to DockerHub via a separate secret.
permissions:
  contents: read

env:
  IMAGE_NAME: agent-studio
  DOCKERHUB_USERNAME: hasithy99x  # DockerHub login username
  DOCKERHUB_ORG: 99xio  # Organization/namespace for publishing images

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    # Emulated linux/arm64 builds can stall indefinitely; without this the job
    # would run until GitHub's 6-hour hard limit. Normal builds finish in ~15m.
    timeout-minutes: 45
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        # Full history needed so we can determine whether the tagged commit
        # is reachable from main (see "Check if tag is releasable as latest" step).
        fetch-depth: 0
      
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v4
      
    - name: Log in to DockerHub
      uses: docker/login-action@v4
      with:
        username: ${{ env.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    - name: Check if tag is releasable as latest
      id: latest_check
      run: |
        # Tags cut from old/maintenance branches (e.g. a hotfix v1.2.1 released
        # after v2.0.0 is already out) must never overwrite the ":latest" image.
        # Only treat a tag as eligible for ":latest" if its commit is an
        # ancestor of (i.e. already part of) the main branch history.
        git fetch origin main --quiet
        if git merge-base --is-ancestor "${{ github.sha }}" origin/main; then
          echo "Tag ${{ github.ref_name }} is on main branch history - eligible for :latest"
          echo "is_latest=true" >> "$GITHUB_OUTPUT"
        else
          echo "Tag ${{ github.ref_name }} is NOT on main branch history - skipping :latest"
          echo "is_latest=false" >> "$GITHUB_OUTPUT"
        fi
        
    - name: Extract metadata
      id: meta
      uses: docker/metadata-action@v6
      with:
        images: ${{ env.DOCKERHUB_ORG }}/${{ env.IMAGE_NAME }}
        tags: |
          # Tag for version tags
          type=ref,event=tag
          # Semantic versioning tags
          type=semver,pattern={{version}}
          type=semver,pattern={{major}}.{{minor}}
          type=semver,pattern={{major}}
          # Latest tag only for stable releases (no pre-release suffixes like -beta, -alpha, -rc)
          # AND only when the tagged commit is reachable from main (not an old/maintenance branch)
          type=raw,value=latest,enable=${{ !contains(github.ref_name, '-') && steps.latest_check.outputs.is_latest == 'true' }}
        labels: |
          org.opencontainers.image.title=${{ env.IMAGE_NAME }}
          org.opencontainers.image.description=Agent Studio - AI Agent workflow management platform
          org.opencontainers.image.vendor=${{ env.DOCKERHUB_ORG }}
          
    - name: Build and push Docker image
      uses: docker/build-push-action@v6
      with:
        context: .
        file: ./Dockerfile
        platforms: linux/amd64,linux/arm64
        push: true
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        cache-from: type=gha
        cache-to: type=gha,mode=max
        
    - name: Generate build summary
      run: |
        echo "## 🚀 Agent Studio Docker Image Published Successfully!" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "**Image:** \`${{ env.DOCKERHUB_ORG }}/${{ env.IMAGE_NAME }}\`" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "**Tags:**" >> $GITHUB_STEP_SUMMARY
        echo '${{ steps.meta.outputs.tags }}' | sed 's/^/- `/' | sed 's/$/`/' >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "**Eligible for :latest:** ${{ steps.latest_check.outputs.is_latest }}" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "**Platforms:** linux/amd64, linux/arm64" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "**Docker Pull Command:**" >> $GITHUB_STEP_SUMMARY
        echo "\`\`\`bash" >> $GITHUB_STEP_SUMMARY
        echo "docker pull ${{ env.DOCKERHUB_ORG }}/${{ env.IMAGE_NAME }}:latest" >> $GITHUB_STEP_SUMMARY
        echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "**Quick Start:**" >> $GITHUB_STEP_SUMMARY
        echo "\`\`\`bash" >> $GITHUB_STEP_SUMMARY
        echo "# Create environment file" >> $GITHUB_STEP_SUMMARY
        echo "cat > .env.production << EOF" >> $GITHUB_STEP_SUMMARY
        echo "XIANS_APIKEY=your-api-key" >> $GITHUB_STEP_SUMMARY
        echo "XIANS_SERVER_URL=https://your-server.com" >> $GITHUB_STEP_SUMMARY
        echo "NEXTAUTH_URL=https://your-domain.com" >> $GITHUB_STEP_SUMMARY
        echo "NEXTAUTH_SECRET=your-secret" >> $GITHUB_STEP_SUMMARY
        echo "GOOGLE_CLIENT_ID=your-google-client-id" >> $GITHUB_STEP_SUMMARY
        echo "GOOGLE_CLIENT_SECRET=your-google-client-secret" >> $GITHUB_STEP_SUMMARY
        echo "EOF" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "# Run the container" >> $GITHUB_STEP_SUMMARY
        echo "docker run -d --name agent-studio -p 3000:3000 \\" >> $GITHUB_STEP_SUMMARY
        echo "  --env-file .env.production \\" >> $GITHUB_STEP_SUMMARY
        echo "  --restart unless-stopped \\" >> $GITHUB_STEP_SUMMARY
        echo "  ${{ env.DOCKERHUB_ORG }}/${{ env.IMAGE_NAME }}:latest" >> $GITHUB_STEP_SUMMARY
        echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "**Health Check:**" >> $GITHUB_STEP_SUMMARY
        echo "\`\`\`bash" >> $GITHUB_STEP_SUMMARY
        echo "curl http://localhost:3000/api/health" >> $GITHUB_STEP_SUMMARY
        echo "\`\`\`" >> $GITHUB_STEP_SUMMARY